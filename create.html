<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Stone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Додати камінь</h1>
      <nav><a class="btn" href="index.html">← Назад до списку</a></nav>
    </div>
  </header>

  <main class="container">
    <form id="createForm" class="form">
      <label>
        Тип
        <select id="type" required>
          <option value="">— Оберіть тип —</option>
          <option>Diamond</option>
          <option>Ruby</option>
          <option>Emerald</option>
          <option>Sapphire</option>
          <option>Opal</option>
        </select>
      </label>

      <label>
        Карати
        <input id="carats" type="number" step="0.01" min="0.01" required />
      </label>

      <button class="btn" type="submit">Створити</button>
    </form>
  </main>

  <script>
    const API = 'http://localhost:3000';

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const carats = parseFloat(document.getElementById('carats').value);

      const r = await fetch(`${API}/stones`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, carats })
      });

      if (r.ok) window.location.href = 'index.html';
      else alert('Помилка при створенні');
    });
  </script>
</body>
</html>
